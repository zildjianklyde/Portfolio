<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio</title>
    <link rel="stylesheet" href="./assets/stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#home" class="logo">E-Portfolio</a>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container hero-container">
            <div class="profile-image">
                <img src="assets/picture.jpg" alt="Zildjian Klyde">
            </div>
            
            <div class="hero-content">
                <h1>Hi, I'm <span class="highlight">Zildjian Klyde!</span></h1>
                <p>I am a Developer</p>
                <button class="cta-btn" onclick="scrollToSection('projects')">View My Work</button>
            </div>
        </div>
    </section>

    <section id="projects" class="projects">
        <div class="container">
            <h2>Projects</h2>
            <div class="projects-grid">

                <div class="project-card">
                    <img src="assets/Project1.png"class="project-card img" alt="Project 1">
                    <div class="project-info">
                        <h3>E-Commerce School Project</h3>
                        <p>HTML, CSS, JS</p>
                        <a href="https://zildjianklyde.github.io/E-Commerce/" target="_blank"><button class="project-btn">View Details</button></a>
                    </div>
                </div>

            </div>
            <div class="projects-grid">

                <div class="project-card">
                    <img src="assets/Project2.png" alt="Project 2">
                    <div class="project-info">
                        <h3>School Projects</h3>
                        <p>HTML, CSS, Javascript</p>
                        <a href="https://zildjianklyde.github.io/FavMusic/Music.html" target="_blank"><button class="project-btn" >View Details</button></a>
                    </div>
                </div>

            </div>
        </div>
        
    </section>
    

    <section id="contact" class="contact">
        <div class="container">
            <h2>Get In Touch</h2>
            <form id="contactForm" class="contact-form">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Message" required></textarea>
                <button type="submit" class="cta-btn">Send Message</button>
            </form>
        </div>
    </section>


    <div class="social-links">
        <a href="https://github.com/zildjianklyde" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://www.instagram.com/zildjianklyde/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/zildjianklyde.maglaque.5/" target="_blank"><i class="fab fa-facebook"></i></a>
    </div>

    <script src="./assets/script.js"></script>
</body>
</html>
